<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- PWA: vite-plugin-pwa가 manifest를 자동 주입하지만, 명시적으로 보강 -->
    <meta name="theme-color" content="#804A87" />
    <meta name="description" content="약품 통합 관리 솔루션 — 입고부터 폐기까지, 막힘없는 흐름" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="약플로" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png" />
    <title>약플로 · Yakflo</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- ★ 부팅 안전망 — 화면에 **아무것도 그리지 않는다**.
         메인 모듈을 못 받으면 React 가 아예 못 떠서 오류 카드조차 못 뜬다(= 순백 화면).
         그때만 딱 한 번 새로고침한다. 새 index.html 을 받으면 새 해시로 고쳐진다.
         ★ 무한 새로고침 금지 — sessionStorage 표시로 1회만. 저장소를 못 쓰면 아예 안 한다.
         ★ 떴으면 표시를 지운다 — 다음 배포에서 다시 한 번 쓸 수 있게. -->
    <script>
      (function () {
        var KEY = 'yk_boot_reloaded', WAIT = 8000, done = false;
        function reloadOnce(why) {
          if (done) return; done = true;
          try {
            if (sessionStorage.getItem(KEY)) { console.error('[부팅 실패] ' + why + ' — 이미 한 번 새로고침했다. 멈춘다.'); return; }
            sessionStorage.setItem(KEY, '1');
          } catch (e) { return; }   /* 저장소를 못 쓰면 되풀이 위험이 있어 하지 않는다 */
          console.error('[부팅 실패] ' + why + ' — 1회 새로고침');
          location.reload();
        }
        window.addEventListener('error', function (e) {
          var el = e && e.target;
          if (el && el.tagName === 'SCRIPT' && el.type === 'module') reloadOnce('모듈 스크립트를 못 받았다: ' + (el.src || ''));
        }, true);
        setTimeout(function () {
          var r = document.getElementById('root');
          if (!r) return;
          if (r.childElementCount === 0) reloadOnce('#root 가 ' + WAIT + 'ms 동안 비어 있다');
          else { try { sessionStorage.removeItem(KEY); } catch (e) { /* 무시 */ } }
        }, WAIT);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
