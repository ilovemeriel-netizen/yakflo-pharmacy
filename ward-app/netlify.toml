# 병동 신청 앱 — Netlify 사이트 설정
# ※ Netlify UI에서 Base directory = ward-app 으로 지정하면 아래 경로는 ward-app 기준으로 해석된다.
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# SPA: 정적 파일·Function 경로가 아니면 index.html 로
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
